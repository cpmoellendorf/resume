career-profile:
  title: Objective
  summary: |
    Undergraduate student and UC Regents Scholar at UCLA studying statistics
    and data science. Currently researching theory and application of advanced 
    statistical models. Pursuing graduate education and research.
education:
  title: Education
  info:
  - degree: BS in Statistics and Data Science
    university: UCLA
    time: 2025 - Present
  - degree: AS in Applied Science
    university: Pasadena City College
    time: 2019 - 2025

experiences:
  title: Experiences
  info:
  - role: Statistics Research Aide
    time: March 2026 - Present
    company: UCLA
    details: |
        - Work with a faculty mentor to analyze foundational papers 
        (along with their accompanying code packages) on modern statistical network 
        models, machine learning algorithms, and regression techniques.
        - Present applications of techniques in the above papers to faculty mentor, 
        demonstrating understanding through content break-downs and code projects.
  - role: PolySummer TA
    time: June 2026 - July 2026
    company: Polytechnic School
    details: |
        - Assisted lead teachers in daily Math, Robotics, and Game Design classes, 
        helping manage classroom activities and occasionally leading full class sessions.
        - Guided students ages 6-12 through hands-on projects/coursework, helping them 
        troubleshoot game design bugs and understand math concepts.
  - role: Poly Extended Program (PEP) Staff
    time: September 2024 - June 2025
    company: Polytechnic School
    details: |
        - Supervised students in an inclusive after-school program, assisting 
        students with conflict resolution and emotional regulation.
        - Facilitated engaging, developmentally appropriate activities that 
        encourage collaboration and self-expression.

